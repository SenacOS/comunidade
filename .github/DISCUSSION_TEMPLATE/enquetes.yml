name: "Nova enquente"
description: "Proponha uma decisão comunitária, técnica ou de projeto para a organização."
labels: ["enquente"]
body:
  - type: markdown
    attributes:
      value: |
        As enquentes ajudam a guiar os rumos da nossa comunidade de forma democrática. 
        **Nota:** O GitHub Discussions possui um recurso nativo de Enquetes (Polls). Use este formulário para dar **contexto** à decisão. A ferramenta de votação em si (os botões) aparecerá na interface do GitHub no momento da criação do tópico.

  - type: textarea
    id: contexto
    attributes:
      label: Contexto e Motivo da Enquete
      description: Por que precisamos tomar essa decisão agora? Qual é o cenário atual?
      placeholder: "Ex.: Precisamos definir qual será a stack de frontend padrão para o próximo grande projeto em grupo..."
    validations:
      required: true

  - type: textarea
    id: impacto
    attributes:
      label: Impacto da Decisão
      description: O que muda na organização ou nos repositórios dependendo do resultado?
      placeholder: "Ex.: A tecnologia vencedora ditará a arquitetura do repositório base e os tutoriais que vamos produzir nas próximas semanas."
    validations:
      required: true

  - type: input
    id: prazo
    attributes:
      label: Prazo para Encerramento
      description: Até quando os membros podem votar e debater nos comentários?
      placeholder: "Ex.: Sexta-feira, 30/11 às 23h59"
    validations:
      required: true